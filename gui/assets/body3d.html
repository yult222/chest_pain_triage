<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Body 3D Selector</title>
  <style>
    :root {
      --bg-a: #f6fbfd;
      --bg-b: #e7f0f5;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-border: rgba(205, 222, 231, 0.95);
      --text-main: #14304a;
      --text-subtle: #587286;
      --chip-bg: #ecf4f7;
      --chip-text: #4d6678;
      --chip-active-bg: #dff1f3;
      --chip-active-text: #0f5f65;
      --shadow: 0 18px 40px rgba(23, 49, 74, 0.12);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0) 40%),
        linear-gradient(135deg, var(--bg-a), var(--bg-b));
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
    }

    #container {
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      user-select: none;
      pointer-events: none;
      z-index: 2;
    }

    .hud-card {
      min-width: 230px;
      max-width: 290px;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #62849a;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .subtitle,
    .status-label {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-subtle);
    }

    #status-badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      margin-top: 10px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--chip-bg);
      color: var(--chip-text);
      font-size: 13px;
      font-weight: 700;
      box-sizing: border-box;
    }

    #status-badge.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
    }

    #status-badge.error {
      background: #fde9e5;
      color: #9b2d21;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div class="overlay">
    <div class="hud-card">
      <div class="eyebrow">Pain Locator</div>
      <div class="title">疼痛定位</div>
      <div class="subtitle">点击数字人选择最主要的不适区域，结果会同步回桌面表单。</div>
    </div>
    <div class="hud-card">
      <div class="status-label">当前选择</div>
      <div id="status-badge">未选择</div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.161.0/build/three.min.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="./body3d.js"></script>
</body>
</html>

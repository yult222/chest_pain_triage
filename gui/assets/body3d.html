<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Body 3D Selector</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f8fc;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    #container {
      width: 100%;
      height: 100%;
    }

    #hint {
      position: absolute;
      left: 12px;
      bottom: 10px;
      font-size: 12px;
      color: #18304b;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 6px;
      padding: 6px 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="hint">点击模型选择疼痛位置</div>

  <script src="https://unpkg.com/three@0.161.0/build/three.min.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="./body3d.js"></script>
</body>
</html>
